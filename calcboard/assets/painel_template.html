  if (E.variantes.length > 1 && E.parcelas.length) h += `<div class="card" style="margin-top:14px"><div class="head3d"><b>${t('comparaVar')}</b><span>${E.rotulo_por ? esc(E.rotulo_por) : ''}</span></div><div id="p_var" class="plot" style="height:300px"></div></div>`;
  box.innerHTML = h;
  document.querySelectorAll('#var_seg button').forEach(b => b.onclick = () => { VAR = b.dataset.v; lsSet('variante', VAR); desenharEnergia(); });

  desenharEnergia();
}
function desenharEnergia() {
  const E = D.energia; if (!E) return;
  document.querySelectorAll('#var_seg button').forEach(b => b.classList.toggle('on', b.dataset.v === VAR));
  const T = temaPlot();
  E.diagramas.forEach((dg, k) => {
    const L = dg.niveis.map((n, i) => ({x: n.x != null ? n.x : i, y: n.ev[VAR], t: n.rotulo, cor: n.cor || (i === 0 ? css('--acc') : (i === dg.niveis.length - 1 ? css('--ok') : css('--muted')))})).filter(l => l.y != null);
    if (!L.length) { $('p_dg' + k).innerHTML = `<div class="vazio">${t('semEnergia')}</div>`; return; }
    const sh = [], an = [], ys = L.map(l => cv(l.y));
    const perfil = dg.tipo === 'perfil';
    L.forEach(l => {
      sh.push({type: 'line', x0: l.x - .3, x1: l.x + .3, y0: cv(l.y), y1: cv(l.y), line: {color: l.cor, width: 5}});
      an.push({x: l.x, y: cv(l.y), text: `<b>${sgn(cv(l.y), dig())}</b>`, showarrow: false, yshift: 14, font: {size: 13, color: T.ink}});
    });
    const tr = [{x: L.map(l => l.x), y: ys, mode: 'markers', marker: {opacity: 0}, hoverinfo: 'skip'}];
    if (perfil) {
      const px = [], py = [];
      L.forEach((l, i) => { if (i) { const a = L[i - 1]; for (let q = 1; q < 20; q++) { const u = q / 20; px.push(a.x + .3 + (l.x - .3 - a.x - .3) * u); py.push(cv(a.y) + (cv(l.y) - cv(a.y)) * (3 * u * u - 2 * u * u * u)); } } px.push(l.x - .3, l.x + .3); py.push(cv(l.y), cv(l.y)); });
      tr.push({x: px, y: py, mode: 'lines', line: {color: css('--muted'), width: 2, dash: 'dot'}, hoverinfo: 'skip'});
    } else if (dg.ligar) for (let i = 1; i < L.length; i++) sh.push({type: 'line', x0: L[i - 1].x + .3, x1: L[i].x - .3, y0: cv(L[i - 1].y), y1: cv(L[i].y), line: {color: '#999', width: 1.4, dash: 'dot'}});
    (dg.passos || []).forEach(p => {
      const a = L[p.de], b = L[p.para]; if (!a || !b) return;
      const d = cv(b.y) - cv(a.y);
      sh.push({type: 'line', x0: a.x + .3, x1: b.x - .3, y0: cv(a.y), y1: cv(b.y), line: {color: d < 0 ? css('--neg') : css('--pos'), width: 2, dash: 'dash'}});
      an.push({x: (a.x + b.x) / 2, y: (cv(a.y) + cv(b.y)) / 2, text: `${esc(p.rotulo || '')}<br><b>${sgn(d, dig())}</b>`, showarrow: false, font: {size: 12, color: d < 0 ? css('--neg') : css('--pos')}, bgcolor: 'rgba(127,127,127,.12)', borderpad: 3});
    });
    const lo = Math.min(...ys), hi = Math.max(...ys), pad = Math.max((hi - lo) * 0.25, 0.5);
    plot('p_dg' + k, tr, plotLayout(T, {shapes: sh, annotations: an, showlegend: false,
      xaxis: {tickmode: 'array', tickvals: L.map(l => l.x), ticktext: L.map(l => l.t), range: [Math.min(...L.map(l => l.x)) - .6, Math.max(...L.map(l => l.x)) + .6], zeroline: false, showgrid: false},
      yaxis: {title: `${LANG === 'en' ? 'relative energy' : 'energia relativa'} (${un()}${E.rotulo_por ? ' ' + E.rotulo_por : ''})`, range: [lo - pad, hi + pad], gridcolor: T.grid, zerolinecolor: T.grid}, height: 430}));
  });
  const selos = E.selos[VAR] || [];
  $('en_src').innerHTML = `<div class="src"><b>${t('calculadoCom')} (${esc(VAR)}):</b> ${selos.map(seloHtml).join(' ') || NR}</div>`;
  $('en_av').innerHTML = (E.avisos || []).filter(a => a.includes(VAR) || E.variantes.length === 1).map(a => `<div class="alerta warn">⚠ ${esc(a)}</div>`).join('') + (E.digitados.length ? `<p class="cap">ⓘ ${t('digitado')}: ${E.digitados.map(esc).join(', ')}</p>` : '');
  $('termos').innerHTML = '';
  E.parcelas.forEach(p => {
    const v = p.ev[VAR]; if (v == null && !E.variantes.some(x => p.ev[x] != null)) return;
    let cls = p.classe; if (cls === 'auto') cls = v == null ? '' : (v > 0 ? 'pos' : 'neg');
    const cor = cls === 'pos' ? 'var(--pos)' : (cls === 'neg' ? 'var(--neg)' : 'var(--ink)');
    const outros = E.variantes.filter(x => x !== VAR && p.ev[x] != null).map(x => `${esc(x)}: <b>${sgn(cv(p.ev[x]), dig())}</b> ${un()}`).join('<br>');
    $('termos').appendChild(el('div', 'termo ' + (cls === 'total' ? 'tot' : cls), `<div class="t">${esc(p.nome)}</div><div class="n" style="color:${cor}">${v == null ? '—' : sgn(cv(v), dig())} <small style="font-size:14px;font-weight:400">${un()}</small></div>${p.txt ? '<p>' + esc(p.txt) + '</p>' : ''}${rsHtml(p.rs)}<div class="cap">${t('expr')}: <code>${esc(p.expr)}</code></div>${outros ? '<div class="fx">' + outros + '</div>' : ''}`));
  });
  if ($('p_var')) {
    const nomes = E.parcelas.map(p => p.nome);
    const cores = [css('--acc'), css('--ok'), css('--acc2'), '#9467bd', '#8c564b'];
    plot('p_var', E.variantes.map((vn, k) => ({type: 'bar', name: vn, x: nomes, y: E.parcelas.map(p => cv(p.ev[vn])), marker: {color: cores[k % cores.length]}, hovertemplate: '%{x}<br>%{y:.' + dig() + 'f} ' + un() + '<extra>' + esc(vn) + '</extra>'})),
      plotLayout(T, {barmode: 'group', yaxis: {title: un(), gridcolor: T.grid, zerolinecolor: T.ink}, legend: {orientation: 'h', y: 1.18}, height: 300, margin: {l: 70, r: 10, t: 10, b: 70}}));
  }
}

  const V = D.valid, B = V.bandas || {};
  let h = (V.titulo ? `<h3 style="margin-top:0">${esc(V.titulo)}</h3>` : '') + (V.nota ? `<p class="cap">${esc(V.nota)}</p>` : '') + rsHtml(V.ressalvas);
  box.innerHTML = h;
  if (V.sistemas.length) {
    const g = el('div', 'mgrid'); box.appendChild(g);
    V.sistemas.forEach(s => {
      let c = `<b>${esc(s.sistema)}</b> <small style="color:var(--muted)">${s.n} ${t('atomos')} · ${esc(s.rotulo_a)} × ${esc(s.rotulo_b)}</small><div class="kv">`;
      c += `<div><small>${t('v_forcaMae')}${s.mae_tipo === 'atomo' ? ' (' + t('v_maeAtomo') + ')' : ''}</small><b>${fmt(s.mae, 1)} meV/Å</b> ${bandaPill(B.forca_mae, s.faixa_mae)}</div>`;
      if (s.max_comp != null) c += `<div><small>${t('v_maxComp')}</small><b>${fmt(s.max_comp, 0)} meV/Å</b> ${bandaPill(B.forca_max, s.faixa_max)}</div>`;
      c += `<div><small>${t('v_mediaAtomo')}</small><b>${fmt(s.media_atomo, 1)} meV/Å</b></div>`;
      if (s.tensao) c += `<div><small>${t('v_tensao')}</small><b>${fmt(s.tensao.mae, 3)} GPa</b> ${bandaPill(B.tensao_mae, s.tensao.faixa)}<br><small>${t('v_maxComp')} ${fmt(s.tensao.max, 3)} GPa</small></div>`;
      c += '</div>';
      const GR = s.componentes || s.moleculas;
      if (GR) {
        const ks = Object.keys(GR).sort((a, b) => (GR[b].parcela || 0) - (GR[a].parcela || 0)), cor = (k, i) => GR[k].cor || COR_PAL[i % COR_PAL.length];

        c += `<div class="leg">${ks.map((k, i) => `<span><i style="background:${cor(k, i)}"></i>${esc(k)} ${fmt((GR[k].parcela || 0) * 100, 0)}% · ${GR[k].mae != null ? 'MAE ' + fmt(GR[k].mae, 0) : '|ΔF| ' + fmt(GR[k].media_atomo, 0)} meV/Å</span>`).join('')}</div>`;
      }
      const els = Object.keys(s.elementos || {});
      if (els.length) c += `<p class="cap" style="margin:10px 0 4px">${t('v_porEl')}</p><div class="tabw"><table class="mini"><tr><th></th><th>n</th><th>${s.mae_tipo === 'atomo' ? '|ΔF|' : 'MAE'} (meV/Å)</th><th>${t('v_parcela')}</th></tr>${els.map(k => { const e = s.elementos[k]; return `<tr><th>${esc(k)}</th><td>${e.n}</td><td>${fmt(s.mae_tipo === 'atomo' ? e.media_atomo : e.mae, 1)}</td><td>${e.parcela != null ? fmt(e.parcela * 100, 0) + '%' : '—'}</td></tr>`; }).join('')}</table></div>`;
      const cs = Object.entries(s.conc || {}).filter(([, v]) => v.fracao != null);
      if (cs.length) c += `<p class="cap">${cs.map(([p, v]) => t('v_conc').replace('{p}', p).replace('{n}', v.n).replace('{f}', fmt(v.fracao * 100, 0))).join(' · ')}</p>`;
      if (EST[s.id] || D.est.some(e => e.dF && e.dF_rot === s.rotulo_a + ' × ' + s.rotulo_b)) c += `<button class="btn" data-erro="${esc(s.id)}">${t('v_abrirDf')}</button>`;

      .then(gd => { if (!gd) return; gd.removeAllListeners && gd.removeAllListeners('plotly_click'); gd.on('plotly_click', ev => { const id = ev.points[0].customdata; if (id) abrirNoExplorador(id); }); });

function zFilmeInfo() {

function abrirZoom(ctx) {

/* ---------- atualização automática (só por JS, adiada enquanto em uso) ---------- */
function iniciarRecarga() {
  const ind = $('reload_ind'), bt = $('reload_pausa');
  const PER = D.meta.recarga_s * 1000, OCIOSO = 60000;
  if (!(PER > 0)) { ind.textContent = ''; bt.style.display = 'none'; return; }
  let ult = Date.now(), prox = Date.now() + PER, pausado = lsGet('pausa', false);
  ['pointerdown', 'keydown', 'wheel', 'touchstart', 'input', 'change'].forEach(ev => window.addEventListener(ev, () => { ult = Date.now(); }, {passive: true, capture: true}));
  const txt = () => {
    const rest = prox - Date.now(), ocup = zAberto || (Date.now() - ult < OCIOSO);
    if (pausado) return t('pausada');
    if (rest > 0) return t('prox') + ' ' + String(Math.floor(rest / 60000)).padStart(2, '0') + ':' + String(Math.floor(rest % 60000 / 1000)).padStart(2, '0');
    return ocup ? t('adiada') : t('atualizando');
  };
  const pinta = () => { ind.textContent = txt(); bt.textContent = pausado ? t('retomar') : t('pausar'); };
  bt.onclick = () => { pausado = !pausado; lsSet('pausa', pausado); if (!pausado) prox = Date.now() + PER; pinta(); };
  setInterval(() => { pinta(); if (!pausado && Date.now() >= prox && !zAberto && Date.now() - ult >= OCIOSO) { salvarEstado(); zSalvar(); location.reload(); } }, 1000);
  pinta();
}

/* ---------- estado da página (sobrevive a recarregar) ---------- */
function salvarEstado() {

    if ($('rep2')) o.r2 = {rep: $('rep2').value, est: $('est2').value, h: $('h2').checked, box: $('box2').checked, med: $('med2') ? $('med2').checked : true};
    if ($('e_sis')) o.exp = {id: $('e_sis').value, modo: EX.modo, rep: $('e_rep').value, h: $('e_h').checked, view: EX.v ? EX.v.getView() : null};
    if (FI.f) o.film = {id: FI.f.id, i: FI.i};
    lsSet('pagina', o);
  } catch (e) { /* ignora */ }
}
function restaurarEstado() {
  const o = lsGet('pagina', null); if (!o) return;
  try {
    if (o.r2 && $('rep2')) { $('rep2').value = o.r2.rep; $('est2').value = o.r2.est || 'bastao'; $('h2').checked = o.r2.h !== false; $('box2').checked = o.r2.box !== false; if ($('med2')) $('med2').checked = o.r2.med !== false; window.__redes2(); }
    if (o.exp && $('e_sis') && EST[o.exp.id]) {
      $('e_sis').value = o.exp.id; $('e_rep').value = o.exp.rep || '1,1,1'; $('e_h').checked = o.exp.h !== false; EX.modo = o.exp.modo || 'final';
      document.querySelectorAll('#e_modo button').forEach(x => x.classList.toggle('on', x.dataset.m === EX.modo));
      exploradorRender(false); if (o.exp.view && EX.v) { EX.v.setView(o.exp.view); EX.v.render(); }

    if (o.y && !location.hash) setTimeout(() => window.scrollTo(0, o.y), 250);

}
